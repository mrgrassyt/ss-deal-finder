# SS Deal Finder on an always-on server. Set DOMAIN and SSDEAL_PASSWORD in .env (tools/server/setup.sh does it for you).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SSDEAL_HUB: "1"            # several private accounts on one server (see SERVER.md)
      SSDEAL_ADMIN_USER: ${SSDEAL_ADMIN_USER:-admin}
      SSDEAL_MAX_USERS: ${SSDEAL_MAX_USERS:-6}
      SSDEAL_PASSWORD: ${SSDEAL_PASSWORD:?set SSDEAL_PASSWORD in .env}      # password of the first (admin) account; after that everyone changes their own under Account
      SSDEAL_PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      TZ: ${TZ:-Europe/Riga}
    volumes:
      - ./data:/data           # your database and settings live here; updates never touch it
    expose:
      - "8765"                  # only the web server below can reach it
  site:                          # the portfolio at SITE_DOMAIN (mrgrass.me); see portfolio/README.md
    build: ./portfolio
    restart: unless-stopped
    environment:
      # Password for the site's dashboard (/admin) until you change it there. Falls back to the deal finder's first password.
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-${SSDEAL_PASSWORD}}
      SITE_URL: https://${SITE_DOMAIN:-site.localhost}
      SMTP_HOST: ${SMTP_HOST:-}                # optional: forward contact-form messages by email
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SITE_MAIL_TO: ${SITE_MAIL_TO:-}
      TZ: ${TZ:-Europe/Riga}
    volumes:
      - ./sitedata:/data         # the site's content and uploaded pictures; updates never touch it
    expose:
      - "8770"
  web:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app, site]
    environment:
      DOMAIN: ${DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN:-site.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # the HTTPS certificate
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
