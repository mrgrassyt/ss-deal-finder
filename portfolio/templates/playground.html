{% extends "base.html" %}
{% block main %}
<div class="wrap">
  <header class="page-head"><h1 class="display">Playground</h1><p class="lede">Small tools and experiments. Everything runs in your browser; nothing you type is sent anywhere.</p></header>
  <div class="toys" style="margin-bottom:80px">
    {% for t in builtin + custom %}
    <a class="toy-card" href="/playground/{{ t.slug }}"><h3>{{ t.title }}</h3><span>{{ t.summary }}</span><i>Open</i></a>
    {% endfor %}
  </div>
</div>
{% endblock %}
